components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GrantItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        amount:
          type: string
        deadline:
          type: string
        agency:
          type: string
        url:
          type: string
        status:
          type: string
        extra:
          type: object
          additionalProperties: true
      required:
        - id
        - title
    GrantsGovResult:
      type: object
      properties:
        source:
          type: string
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrantItem"
      required:
        - source
        - items
    SbirResult:
      type: object
      properties:
        source:
          type: string
        total:
          type: integer
        items:
          type: array
