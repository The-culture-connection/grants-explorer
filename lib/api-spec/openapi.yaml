openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Grants Explorer API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: grants
    description: Grant funding API endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /grants/grantsgov:
    get:
      operationId: getGrantsGov
      tags: [grants]
      summary: Fetch Grants.gov opportunities
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: rows
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Grants.gov results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantsGovResult"
  /grants/sbir:
    get:
      operationId: getSbir
      tags: [grants]
      summary: Fetch SBIR/STTR awards
      parameters:
